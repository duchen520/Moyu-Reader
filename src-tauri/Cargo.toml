[package]
name = "tomato-reader"
version = "0.5.17"
description = "Independent Windows reading client prototype"
authors = ["Tomato Reader Contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "tomato_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "cookies"] }
serde_json = "1"
html5ever = "0.39"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
httpdate = "1"
url = "2"

aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
sha2 = "0.10"
sm3 = "0.4"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "tomato-reader"
path = "src/main.rs"
required-features = ["desktop"]

# Local App protocol and normal media decoding

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
